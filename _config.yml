# Site-wide configuration
locale: "en-US"
site_theme: "default"
title: "Junteng Liu"
title_separator: "-"
name: &name "Junteng Liu"
description: &description "Academic homepage of Junteng Liu, a Ph.D. candidate working on natural language processing and machine learning."
url: "https://plathanasoolmetc.github.io"
baseurl: "/LJT-Homepage"
repository: "plathanasoolmetc/LJT-Homepage"

# Sidebar profile
author:
  avatar:
  name: "Junteng Liu"
  pronouns:
  bio: "Ph.D. candidate at the HKUST NLP Group"
  location: "Hong Kong"
  employer: "Hong Kong University of Science and Technology"
  uri:
  email: "jliugi@connect.ust.hk"
  academia:
  arxiv:
  googlescholar: "https://scholar.google.com/citations?hl=en&user=tbK9jl4AAAAJ&view_op=list_works&sortby=pubdate"
  inspire-hep:
  impactstory:
  orcid:
  semantic:
